<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006233" />
      <stop offset="100%" stop-color="#004d27" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3C64F" />
      <stop offset="100%" stop-color="#D49A24" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe padding for maskable -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Moroccan Zellige Geometric Background Pattern -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="2" fill="none">
    <path d="M256 32 L288 96 L352 64 L320 128 L384 160 L320 192 L352 256 L288 224 L256 288 L224 224 L160 256 L192 192 L128 160 L192 128 L160 64 L224 96 Z" />
    <circle cx="256" cy="256" r="210" />
    <circle cx="256" cy="256" r="160" />
    <polygon points="256,66 306,166 418,174 332,248 358,358 256,300 154,358 180,248 94,174 206,166" />
  </g>

  <!-- Center Card / Price Badge -->
  <g filter="url(#shadow)">
    <!-- 8-Pointed Moroccan Star Emblem Outline -->
    <path d="M256 100 L288 138 L340 132 L352 184 L398 206 L386 256 L414 300 L376 336 L376 388 L324 394 L296 438 L256 414 L216 438 L188 394 L136 388 L136 336 L98 300 L126 256 L114 206 L160 184 L172 132 L224 138 Z" 
          fill="#FFFFFF" />

    <!-- Inner Shield / Tag -->
    <rect x="180" y="150" width="152" height="212" rx="24" fill="#C1272D" />

    <!-- Tag hole -->
    <circle cx="256" cy="184" r="14" fill="#FFFFFF" />

    <!-- Moroccan 5-pointed Star in Emerald Green -->
    <g transform="translate(256, 252) scale(0.65)">
      <!-- Golden Moroccan Star -->
      <polygon points="0,-60 18,-18 62,-18 26,9 40,52 0,25 -40,52 -26,9 -62,-18 -18,-18" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="3" />
    </g>

    <!-- Barcode Stripes at bottom of tag -->
    <g fill="#FFFFFF" opacity="0.95">
      <rect x="204" y="318" width="6" height="28" rx="2" />
      <rect x="214" y="318" width="12" height="28" rx="2" />
      <rect x="230" y="318" width="4" height="28" rx="2" />
      <rect x="238" y="318" width="10" height="28" rx="2" />
      <rect x="252" y="318" width="6" height="28" rx="2" />
      <rect x="262" y="318" width="14" height="28" rx="2" />
      <rect x="280" y="318" width="4" height="28" rx="2" />
      <rect x="288" y="318" width="10" height="28" rx="2" />
      <rect x="302" y="318" width="6" height="28" rx="2" />
    </g>

    <!-- Checkmark Badge in Green -->
    <circle cx="336" cy="350" r="32" fill="#006233" stroke="#FFFFFF" stroke-width="4" />
    <path d="M324 350 L332 358 L348 340" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
